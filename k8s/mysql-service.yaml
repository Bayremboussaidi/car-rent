apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: comparateur-app
  labels:
    app: comparateur
    component: mysql
    version: v1.0.0
spec:
  selector:
    app: comparateur
    component: mysql
  ports:
  - name: mysql
    port: 3306
    targetPort: 3306
    protocol: TCP
  type: ClusterIP
  clusterIP: None  # Headless service for StatefulSet