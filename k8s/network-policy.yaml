apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mysql-network-policy
  namespace: comparateur-app
  labels:
    app: comparateur
    component: mysql
spec:
  podSelector:
    matchLabels:
      app: comparateur
      component: mysql
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: comparateur
          component: backend
    ports:
    - protocol: TCP
      port: 3306
  egress:
  - {} # Allow all egress for MySQL initialization

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-network-policy
  namespace: comparateur-app
  labels:
    app: comparateur
    component: backend
spec:
  podSelector:
    matchLabels:
      app: comparateur
      component: backend
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: comparateur
          component: frontend
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8084
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: comparateur
          component: mysql
    ports:
    - protocol: TCP
      port: 3306
  - to: [] # Allow DNS resolution
    ports:
    - protocol: UDP
      port: 53

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-network-policy
  namespace: comparateur-app
  labels:
    app: comparateur
    component: frontend
spec:
  podSelector:
    matchLabels:
      app: comparateur
      component: frontend
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 80
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: comparateur
          component: backend
    ports:
    - protocol: TCP
      port: 8084