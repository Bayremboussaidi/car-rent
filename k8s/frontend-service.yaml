apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: comparateur-app
  labels:
    app: comparateur
    component: frontend
    version: v1.0.0
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
spec:
  selector:
    app: comparateur
    component: frontend
  ports:
  - name: http
    port: 80
    targetPort: 80
    protocol: TCP
  - name: https
    port: 443
    targetPort: 80
    protocol: TCP
  type: LoadBalancer
  sessionAffinity: None
  # For NodePort access (alternative to LoadBalancer)
  # type: NodePort
  # ports:
  # - name: http
  #   port: 80
  #   targetPort: 80
  #   nodePort: 30000
  #   protocol: TCP