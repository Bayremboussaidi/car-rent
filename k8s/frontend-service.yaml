apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: comparateur-app
  labels:
    app: frontend
spec:
  selector:
    app: frontend
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
  type: LoadBalancer
  # For NodePort access, uncomment below and comment LoadBalancer above
  # type: NodePort
  # ports:
  # - port: 80
  #   targetPort: 80
  #   nodePort: 30000