apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend-pdb
  namespace: comparateur-app
  labels:
    app: comparateur
    component: backend
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: comparateur
      component: backend

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: frontend-pdb
  namespace: comparateur-app
  labels:
    app: comparateur
    component: frontend
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: comparateur
      component: frontend